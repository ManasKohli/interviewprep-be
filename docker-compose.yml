services:
  backend:
    depends_on:
      - postgres
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: